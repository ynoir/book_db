<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.datatables.net/1.12.1/css/jquery.dataTables.min.css">
        <style>
            :root {
                --primary: #64748b;
                --primary-muted: #f1f5f9;
                --bg: #fcfcfc;
                --text: #1e293b;
                --text-muted: #64748b;
                --border: #e2e8f0;
                --card-bg: #ffffff;
                --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            }
            body { 
                font-family: var(--mono); 
                background-color: var(--bg);
                color: var(--text);
                margin: 0;
                padding: 40px 20px;
                line-height: 1.6;
                font-size: 15px;
                letter-spacing: -0.01em;
            }
            nav {
                background: var(--card-bg);
                padding: 0.5rem;
                border: 1px solid var(--border);
                border-radius: 0;
                margin-bottom: 3rem;
                display: flex;
                gap: 0.25rem;
                align-items: center;
                flex-wrap: wrap;
                max-width: fit-content;
            }
            nav a {
                text-decoration: none;
                color: var(--text-muted);
                transition: all 0.1s;
                padding: 0.4rem 0.75rem;
            }
            nav a:hover {
                color: var(--text);
                background: var(--primary-muted);
            }
            .container {
                max-width: 1200px;
                margin: 0 auto;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin: 1rem 0;
            }
            th, td {
                padding: 12px 0;
                border-bottom: 1px solid var(--border);
                text-align: left;
            }
            th {
                color: var(--text-muted);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                font-weight: 600;
            }
            a {
                color: var(--text);
                text-decoration: underline;
                text-decoration-color: var(--border);
                text-underline-offset: 3px;
                transition: all 0.15s;
            }
            a:hover {
                color: var(--primary);
                text-decoration-color: var(--primary);
            }
            hr { display: none; }
        </style>
        <script
                          src="https://code.jquery.com/jquery-3.6.0.min.js"
                          integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
                          crossorigin="anonymous"></script>
        <script src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.min.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container">
            <nav>
                <a href="/admin/books" target="_blank" style="background: var(--primary); color: white;">Admin Edit</a>
                <a href="/books/books">Books</a>
                <a href="/books/authors">Authors</a>
                <a href="/books/seriess">Series</a>
                <a href="/books/tags">Tags</a>
                <a href="/books/statuss">Status</a>
                <a href="/books/export">Export</a>
            </nav>

            {% block content %}
            {% endblock content %}
        </div>
    <script>
        $(document).ready( function () {
            $('#table').DataTable();
        } );
    </script>
    </body>
</html>
